name: Edge source checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check run page JavaScript syntax and input persistence
        run: |
          node --check src/ui/js/run.js
          node tests/test_run_dom.js
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Storage estimator tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_storage_estimator.py' -v
      - name: System telemetry tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_system_monitor.py' -v
