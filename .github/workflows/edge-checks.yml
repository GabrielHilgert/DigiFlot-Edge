name: Edge source checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check run page JavaScript syntax and input persistence
        run: |
          node --check src/ui/js/run.js
          node --check src/ui/js/operation-feedback.js
          node --check src/ui/js/icons.js
          node tests/test_ui_icons.js
          node tests/test_run_dom.js
          node tests/test_scraping_alert.js
          node --check src/ui/js/settings.js
          node --check src/ui/js/plugin-displays.js
          node tests/test_plugin_displays.js
          bash -n src/install.sh
          bash tests/test_deployment_maintenance.sh
          node tests/test_run_layout.js
          node tests/test_hifie_operational.js
          node tests/test_sensor_calibration_workspace.js
          node --check src/ui/js/experiments.js
          node tests/test_color_palette.js
          node --check src/ui/js/results.js
          node tests/test_results_mjpeg.js
          node tests/test_results_timeline_alignment.js
          node tests/test_operation_feedback.js
          node tests/test_workflow_navigation.js
          node --check src/ui/js/config_cameras.js
      - name: Check Cell Vision and sensor monitoring JavaScript syntax
        run: |
          node --check src/ui/js/cells.js
          node --check src/ui/js/sensors.js
          node tests/test_vision_reference_overlay.js
          node tests/test_calibration_modals.js
          node tests/test_hifie_reuse_ui.js
          node tests/test_hifie_coordinate_plots.js
          node tests/test_hifie_interactive_tuning.js
          node tests/test_hifie_camera_retry.js
          node tests/test_hifie_preview_ui.js
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Test persistent serial sensor identity
        run: |
          python -m pip install -q pyserial
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_serial_identity.py' -v
      - name: Optional plugin loader and synthetic sensor tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_plugins.py' -v
      - name: Process sensor drivers (mock hardware)
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_process_sensors.py' -v
      - name: Results video preview cache tests
        run: python -m unittest discover -s tests -p 'test_results_video_preview.py' -v
      - name: Idle-only MJPEG session and revocation tests
        run: python -m unittest discover -s tests -p 'test_results_media_safety.py' -v
      - name: Install OpenCV for hardware-free vision tests
        run: python -m pip install -q numpy opencv-python-headless scipy pandas scikit-image
      - name: Cell Vision geometry and registry tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_vision_*.py' -v
      - name: Scraping timing and GPIO worker tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_scraping_timing.py' -v
      - name: Storage estimator tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_storage_estimator.py' -v
      - name: System telemetry tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_system_monitor.py' -v
